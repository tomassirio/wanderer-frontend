name: TEMP release notes dry run
on:
  push:
    branches: [feature/release-notes-shipping]
    paths: [.github/workflows/tmp-release-notes-dry-run.yml]
jobs:
  dry-run:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: "1"
        run: |
          # GEMINI_API_KEY unset on purpose: checks the block-only path on a real runner.
          for v in 2.1.0 2.0.6 2.0.4; do
            echo "::group::$v"; .github/scripts/publish-release-notes.sh "$v"; echo "::endgroup::"
          done
          echo "::group::block parser (mawk)"
          awk -W version 2>&1 | head -1 || true
          eval "$(sed -n '/^release_notes_block()/,/^}/p' .github/scripts/publish-release-notes.sh)"
          cat .github/pull_request_template.md - <<'BODY' | release_notes_block
          ## Release notes
          New — Save trips for later
          Not ready to go? Save your trip as a plan.
          - Fixed: Achievement counts
          Your profile now shows the correct number.
          ## Testing
          New — not this one
          nope
          BODY
          echo "::endgroup::"
